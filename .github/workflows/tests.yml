name: Tests

on:
  push:
    branches: [streamlit-data]
  pull_request:
    branches: [streamlit-data]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install numpy pandas pytest requests

      - name: Run tests
        run: pytest -q

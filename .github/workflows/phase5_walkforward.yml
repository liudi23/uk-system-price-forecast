# Phase 5 validation (5a window: done & adopted; now 5b wave 1): seasonal walk-forward with the
# FULL CI feature set (weather, generation mix, CPI deflator) under two level-model
# training windows, and publish the comparison. Manual trigger only; nothing is
# committed back and production model assets are not overwritten (walk-forward mode
# never writes the .pkl files).
#
# Usage: Actions UI -> "Phase 5 walk-forward validation" -> Run workflow (branch: phase-5)
name: Phase 5 walk-forward validation

on:
  workflow_dispatch:

concurrency:
  group: phase5-walkforward
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Reuse the daily pipeline's raw-data cache so weather/genmix/CPI features are
      # identical to production. restore-keys falls back to the newest weekly cache.
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/
          key: raw-data-${{ github.run_id }}   # never matches — always use restore-keys
          restore-keys: raw-data-

      # Best-effort: the walk-forward folds end before the cached data does, so a
      # stale cache only costs the newest few days. An upstream API outage (e.g.
      # Open-Meteo, 2026-11-03) must not block validation. Each source fails soft.
      - name: Top up raw data (best effort)
        run: |
          python src/data/fetch_elexon.py --append     || echo "::warning::Elexon top-up failed — using cached prices"
          python src/data/fetch_weather.py --append    || echo "::warning::weather top-up failed — using cached weather"
          python src/data/fetch_generation.py --append || echo "::warning::generation top-up failed — using cached mix"
          python src/data/fetch_cpi.py                 || echo "::warning::CPI fetch failed — using cached CPI"

      # Phase 5b wave 1: top up the committed vintage CSVs (backfill is done by
      # phase5_backfill.yml; this keeps the last few days current for the folds).
      - name: Top up MID + day-ahead vintages (best effort)
        run: |
          python src/data/fetch_mid.py --append         || echo "::warning::MID top-up failed — using committed vintages"
          python src/data/fetch_da_vintages.py --append || echo "::warning::vintage top-up failed — using committed vintages"

      - name: Extend dataset and build features (A = without 5b data, B = with)
        run: |
          python src/data/extend_dataset.py
          # B: full feature set including Phase 5b vintage/MID features
          python src/features/build_features.py \
            --input  data/processed/dataset_5yr.csv \
            --output data/processed/features_5b.csv
          # A: identical build with the vintage data hidden -> pre-5b feature set
          mv data/vintages data/_vintages_hidden
          python src/features/build_features.py \
            --input  data/processed/dataset_5yr.csv \
            --output data/processed/features_base.csv
          mv data/_vintages_hidden data/vintages

      - name: "Walk-forward A: baseline features (full-history window, no 5b data)"
        run: |
          python src/models/train_phase3.py --walk-forward --level-train-years 0 \
            --features data/processed/features_base.csv \
            2>&1 | tee wf_baseline.log
          cp model_assets/walk_forward_predictions.csv wf_baseline.csv

      - name: "Walk-forward B: + Phase 5b wave-1 features (MID, WINDFOR/TSDF/OCNMFD vintages)"
        run: |
          python src/models/train_phase3.py --walk-forward --level-train-years 0 \
            --features data/processed/features_5b.csv \
            2>&1 | tee wf_full.log
          cp model_assets/walk_forward_predictions.csv wf_full.csv

      - name: Compare and publish summary
        run: |
          python - <<'EOF' | tee comparison.md
          import pandas as pd, numpy as np

          def level_mae(df):
              d = df.groupby("settlement_date").agg(a=("ssp_actual","mean"), p=("pred_level_q50","mean"))
              return float((d.a - d.p).abs().mean()), float((d.p - d.a).mean())

          def summarise(path):
              df = pd.read_csv(path)
              out = {}
              for fold, g in df.groupby("fold"):
                  lm, bias = level_mae(g)
                  out[fold] = dict(
                      mae=float((g.ssp_actual - g.ssp_predicted).abs().mean()),
                      level_mae=lm, level_bias=bias, pinball=pinball(g),
                      cov=float(((g.ssp_actual >= g.ssp_q10) & (g.ssp_actual <= g.ssp_q90)).mean()))
              lm, bias = level_mae(df)
              out["ALL"] = dict(
                  mae=float((df.ssp_actual - df.ssp_predicted).abs().mean()),
                  level_mae=lm, level_bias=bias, pinball=pinball(df),
                  cov=float(((df.ssp_actual >= df.ssp_q10) & (df.ssp_actual <= df.ssp_q90)).mean()))
              return out

          def pinball(df):
              y = df.ssp_actual.values
              d10 = y - df.ssp_q10.values
              d90 = y - df.ssp_q90.values
              pb10 = np.mean(np.maximum(0.10 * d10, -0.90 * d10))
              pb90 = np.mean(np.maximum(0.90 * d90, -0.10 * d90))
              return float((pb10 + pb90) / 2)

          a, b = summarise("wf_baseline.csv"), summarise("wf_full.csv")
          print("## Phase 5 walk-forward: A = baseline (features off) vs B = candidate (features on)\n")
          print("| Fold | MAE A | MAE B | ΔMAE% | LvlMAE A | LvlMAE B | Bias A | Bias B | PB A | PB B | ΔPB% | cov A | cov B |")
          print("|---|---|---|---|---|---|---|---|---|---|---|---|---|")
          for k in list(a.keys()):
              if k not in b: continue
              d   = (b[k]["mae"] / a[k]["mae"] - 1) * 100
              dpb = (b[k]["pinball"] / a[k]["pinball"] - 1) * 100
              print(f"| {k} | {a[k]['mae']:.2f} | {b[k]['mae']:.2f} | {d:+.1f}% | "
                    f"{a[k]['level_mae']:.2f} | {b[k]['level_mae']:.2f} | "
                    f"{a[k]['level_bias']:+.2f} | {b[k]['level_bias']:+.2f} | "
                    f"{a[k]['pinball']:.2f} | {b[k]['pinball']:.2f} | {dpb:+.1f}% | "
                    f"{a[k]['cov']:.3f} | {b[k]['cov']:.3f} |")
          d_all   = (b["ALL"]["mae"] / a["ALL"]["mae"] - 1) * 100
          dpb_all = (b["ALL"]["pinball"] / a["ALL"]["pinball"] - 1) * 100
          cov_ok  = b["ALL"]["cov"] >= a["ALL"]["cov"] - 0.02
          print(f"\nALL: ΔMAE {d_all:+.1f}%  ΔPinball {dpb_all:+.1f}%  cov {a['ALL']['cov']:.3f} → {b['ALL']['cov']:.3f}")
          EOF
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase5-walkforward-results
          path: |
            wf_baseline.csv
            wf_full.csv
            wf_baseline.log
            wf_full.log
            comparison.md
          retention-days: 30

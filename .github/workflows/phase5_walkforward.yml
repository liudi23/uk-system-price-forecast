# Phase 5 validation. History: 5a window (done, adopted), 5b wave 1 (done, adopted
# for the shape head). Current experiment: 5b wave 1.2b — within-day-relative margin
# + solar-profile features for the H+1 shape head (pre-registered in
# docs/phase5b-wave12b-prereg.md).
#
# A = current production feature set (full-history level window + wave-1 MID/vintage
#     shape features) — built with --no-wave12b
# B = A + the six wave-1.2b features — default build
#
# Seasonal walk-forward with the FULL CI feature set; publishes the gate comparison
# plus within-day shape diagnostics (shape corr, peak/pit timing). Manual trigger
# only; nothing is committed back and production model assets are not overwritten
# (walk-forward mode never writes the .pkl files).
#
# Usage: Actions UI -> "Phase 5 walk-forward validation" -> Run workflow
#        (branch: phase-5-wave1.2b)
name: Phase 5 walk-forward validation

on:
  workflow_dispatch:

concurrency:
  group: phase5-walkforward
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Reuse the daily pipeline's raw-data cache so weather/genmix/CPI features are
      # identical to production. restore-keys falls back to the newest weekly cache.
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/
          key: raw-data-${{ github.run_id }}   # never matches — always use restore-keys
          restore-keys: raw-data-

      - name: Top up raw data (same sequence as daily pipeline)
        run: |
          python src/data/fetch_elexon.py --append
          python src/data/fetch_weather.py --append
          python src/data/fetch_generation.py --append
          python src/data/fetch_cpi.py

      # Keep the committed vintage CSVs current for the folds (backfill is done by
      # phase5_backfill.yml).
      - name: Top up MID + day-ahead vintages
        run: |
          python src/data/fetch_mid.py --append
          python src/data/fetch_da_vintages.py --append

      - name: Extend dataset and build features (A = production set, B = + wave 1.2b)
        run: |
          python src/data/extend_dataset.py
          # B: full feature set including the wave-1.2b within-day relatives
          python src/features/build_features.py \
            --input  data/processed/dataset_5yr.csv \
            --output data/processed/features_12b.csv
          # A: identical build minus the wave-1.2b block -> current production set
          python src/features/build_features.py --no-wave12b \
            --input  data/processed/dataset_5yr.csv \
            --output data/processed/features_base.csv

      - name: "Walk-forward A: production feature set (wave 1 on, wave 1.2b off)"
        run: |
          set -o pipefail   # a crashed training run must fail the step, not hide behind tee
          python src/models/train_phase3.py --walk-forward --level-train-years 0 \
            --features data/processed/features_base.csv \
            2>&1 | tee wf_baseline.log
          cp model_assets/walk_forward_predictions.csv wf_baseline.csv

      - name: "Walk-forward B: + wave 1.2b relative margin/solar features"
        run: |
          set -o pipefail   # a crashed training run must fail the step, not hide behind tee
          python src/models/train_phase3.py --walk-forward --level-train-years 0 \
            --features data/processed/features_12b.csv \
            2>&1 | tee wf_full.log
          cp model_assets/walk_forward_predictions.csv wf_full.csv

      - name: Compare and publish summary
        run: |
          python - <<'EOF' | tee comparison.md
          import pandas as pd, numpy as np

          def level_mae(df):
              d = df.groupby("settlement_date").agg(a=("ssp_actual","mean"), p=("pred_level_q50","mean"))
              return float((d.a - d.p).abs().mean()), float((d.p - d.a).mean())

          def pinball(df):
              y = df.ssp_actual.values
              d10 = y - df.ssp_q10.values
              d90 = y - df.ssp_q90.values
              pb10 = np.mean(np.maximum(0.10 * d10, -0.90 * d10))
              pb90 = np.mean(np.maximum(0.90 * d90, -0.10 * d90))
              return float((pb10 + pb90) / 2)

          def shape_diag(df):
              """Within-day diagnostics: shape corr, peak/pit timing (per-day argmax/argmin)."""
              corrs, peak, pit = [], [], []
              for _, day in df.groupby("settlement_date"):
                  day = day.sort_values("settlement_period")
                  if len(day) < 24: continue
                  a = day.ssp_actual.values; p = day.ssp_predicted.values
                  aa = a - a.mean(); pp = p - p.mean()
                  if aa.std() > 0 and pp.std() > 0:
                      corrs.append(float(np.corrcoef(aa, pp)[0, 1]))
                  peak.append(abs(int(np.argmax(p)) - int(np.argmax(a))))
                  pit.append(abs(int(np.argmin(p)) - int(np.argmin(a))))
              peak = np.array(peak); pit = np.array(pit)
              return dict(corr=float(np.mean(corrs)) if corrs else float("nan"),
                          peak_med=float(np.median(peak)) if len(peak) else float("nan"),
                          pit_med=float(np.median(pit)) if len(pit) else float("nan"),
                          pit_le2=float((pit <= 2).mean()) if len(pit) else float("nan"))

          def summarise(path):
              df = pd.read_csv(path)
              out = {}
              for fold, g in df.groupby("fold"):
                  lm, bias = level_mae(g)
                  out[fold] = dict(
                      mae=float((g.ssp_actual - g.ssp_predicted).abs().mean()),
                      level_mae=lm, level_bias=bias, pinball=pinball(g),
                      cov=float(((g.ssp_actual >= g.ssp_q10) & (g.ssp_actual <= g.ssp_q90)).mean()),
                      **shape_diag(g))
              lm, bias = level_mae(df)
              out["ALL"] = dict(
                  mae=float((df.ssp_actual - df.ssp_predicted).abs().mean()),
                  level_mae=lm, level_bias=bias, pinball=pinball(df),
                  cov=float(((df.ssp_actual >= df.ssp_q10) & (df.ssp_actual <= df.ssp_q90)).mean()),
                  **shape_diag(df))
              return out

          a, b = summarise("wf_baseline.csv"), summarise("wf_full.csv")
          print("## Phase 5 wave 1.2b walk-forward: A = production set vs B = + relative margin/solar\n")
          print("| Fold | MAE A | MAE B | ΔMAE% | LvlMAE A | LvlMAE B | Bias A | Bias B | PB A | PB B | ΔPB% | cov A | cov B |")
          print("|---|---|---|---|---|---|---|---|---|---|---|---|---|")
          for k in list(a.keys()):
              if k not in b: continue
              d   = (b[k]["mae"] / a[k]["mae"] - 1) * 100
              dpb = (b[k]["pinball"] / a[k]["pinball"] - 1) * 100
              print(f"| {k} | {a[k]['mae']:.2f} | {b[k]['mae']:.2f} | {d:+.1f}% | "
                    f"{a[k]['level_mae']:.2f} | {b[k]['level_mae']:.2f} | "
                    f"{a[k]['level_bias']:+.2f} | {b[k]['level_bias']:+.2f} | "
                    f"{a[k]['pinball']:.2f} | {b[k]['pinball']:.2f} | {dpb:+.1f}% | "
                    f"{a[k]['cov']:.3f} | {b[k]['cov']:.3f} |")
          print("\n### Within-day shape diagnostics (wave 1.2b secondary endpoints)\n")
          print("| Fold | ShapeCorr A | ShapeCorr B | PeakMed A | PeakMed B | PitMed A | PitMed B | Pit≤2SP A | Pit≤2SP B |")
          print("|---|---|---|---|---|---|---|---|---|")
          for k in list(a.keys()):
              if k not in b: continue
              print(f"| {k} | {a[k]['corr']:.3f} | {b[k]['corr']:.3f} | "
                    f"{a[k]['peak_med']:.0f} | {b[k]['peak_med']:.0f} | "
                    f"{a[k]['pit_med']:.0f} | {b[k]['pit_med']:.0f} | "
                    f"{a[k]['pit_le2']:.0%} | {b[k]['pit_le2']:.0%} |")
          d_all   = (b["ALL"]["mae"] / a["ALL"]["mae"] - 1) * 100
          dpb_all = (b["ALL"]["pinball"] / a["ALL"]["pinball"] - 1) * 100
          print(f"\nALL: ΔMAE {d_all:+.1f}%  ΔPinball {dpb_all:+.1f}%  cov {a['ALL']['cov']:.3f} → {b['ALL']['cov']:.3f}")
          print(f"Gate (pre-registered): ΔMAE ≤ −3% or ΔPinball ≤ −5%, coverage drop ≤ 0.02. "
                f"Shape diagnostics are secondary endpoints — not sufficient for adoption alone.")
          EOF
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase5-walkforward-results
          path: |
            wf_baseline.csv
            wf_full.csv
            wf_baseline.log
            wf_full.log
            comparison.md
          retention-days: 30

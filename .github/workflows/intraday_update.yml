name: Intraday Forecast Update

on:
  schedule:
    # Every hour at :30 past, 08:00–17:00 UTC (09:00–18:00 BST, UK working hours)
    - cron: '30 8-17 * * *'
  workflow_dispatch:  # manual trigger from GitHub Actions UI

jobs:
  intraday:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout streamlit-data
        uses: actions/checkout@v4
        with:
          ref: streamlit-data
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-intraday-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: pip-intraday-

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Check features_recent.csv exists
        id: check_features
        run: |
          if [ -f data/processed/features_recent.csv ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "features_recent.csv not found — daily pipeline has not run yet, skipping."
          fi

      - name: Refresh features if stale
        if: steps.check_features.outputs.found == 'true'
        run: |
          YESTERDAY=$(python3 -c "from datetime import date, timedelta; print(date.today() - timedelta(days=1))")
          FEATURES_END=$(python3 -c "
          import pandas as pd
          df = pd.read_csv('data/processed/features_recent.csv')
          col = 'settlement_datetime' if 'settlement_datetime' in df.columns else df.columns[0]
          print(str(df[col].max())[:10])
          ")
          echo "features end: ${FEATURES_END}, yesterday: ${YESTERDAY}"
          if [ "$FEATURES_END" \< "$YESTERDAY" ]; then
            echo "features stale (${FEATURES_END}), refreshing through ${YESTERDAY}..."
            python src/data/fetch_elexon.py --append
            python src/data/extend_dataset.py
            python src/features/build_features.py \
              --input  data/processed/dataset_5yr.csv \
              --output data/processed/features_5yr.csv
            python3 -c "
          import pandas as pd
          df = pd.read_csv('data/processed/features_5yr.csv', parse_dates=['settlement_datetime'])
          cutoff = df['settlement_datetime'].max() - pd.Timedelta(days=50)
          recent = df[df['settlement_datetime'] > cutoff]
          recent.to_csv('data/processed/features_recent.csv', index=False)
          print(f'features_recent.csv: {len(recent)} rows, ends {recent[\"settlement_datetime\"].max()}')
          "
          else
            echo "features up to date (${FEATURES_END})"
          fi

      - name: Fetch today's intraday prices
        if: steps.check_features.outputs.found == 'true'
        run: python src/data/fetch_intraday.py

      - name: Run H+1 forecast (inference only — no retrain)
        if: steps.check_features.outputs.found == 'true'
        run: python src/models/forecast_phase3.py --date $(date -u +%Y-%m-%d) --features data/processed/features_recent.csv

      - name: Commit and push updated forecast
        if: steps.check_features.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOW=$(date -u +%Y-%m-%dT%H:%M)
          # Touch streamlit_app.py so Streamlit Cloud reloads the updated forecast
          sed -i "s/_LAST_PIPELINE_RUN = \".*\"/_LAST_PIPELINE_RUN = \"${NOW}\"/" \
            src/dashboard/streamlit_app.py
          git add src/dashboard/streamlit_app.py \
                  model_assets/next_day_forecast_phase3.csv \
                  data/processed/features_recent.csv \
                  data/processed/dataset_5yr.csv
          git diff --staged --quiet || \
            git commit -m "Intraday forecast update ${NOW}" && \
            git push origin streamlit-data

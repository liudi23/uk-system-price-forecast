name: Intraday Forecast Update

# Runs every 30 minutes around the clock (48 runs/day) to fetch the latest Elexon
# Initial Settlement prices, apply the Kalman bias corrector, and commit the
# updated forecast + filter state back to the repo so the Streamlit dashboard
# always shows the most current corrected 48-SP view.
#
# Cost: ~1 min/run (no model training — frozen HGBR + Kalman inference only).
# 48 runs/day ≈ 1,440 min/month, within the free-tier 2,000 min/month limit.
# The no-diff guard means idempotent reruns (no new settled SPs) produce no commits.
#
# State persistence: commit-back to model_assets/kalman_state.json.
# Rationale: Actions cache has a 7-day eviction TTL; a cache miss on a bank-holiday
# Monday would cause a silent cold-start (x̂=0, P=P₀) mid-trading-day.
# Commit-back is always authoritative, matches the daily_pipeline.yml pattern.

on:
  repository_dispatch:
    types: [intraday-update]    # primary: external cron-job.org at */30 UTC
  schedule:
    - cron: '*/30 * * * *'    # fallback: GitHub native (may fire late on free tier)
  workflow_dispatch:            # manual re-run / backfill from Actions UI

# Prevent two intraday runs (or an intraday + daily) from pushing simultaneously.
# cancel-in-progress: false queues the next run rather than cancelling it, so no
# settled SP data is silently dropped.  The same group name is used in daily_pipeline.yml
# so daily retrains also serialise against intraday pushes.
concurrency:
  group: streamlit-data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write           # required for commit-back of state + forecast

    steps:
      - name: Checkout streamlit-data
        uses: actions/checkout@v4
        with:
          ref: streamlit-data
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Fetch today's partial Initial Settlement prices from Elexon BMRS.
      # fetch_intraday.py handles API errors gracefully (logs + exits cleanly);
      # if no data is returned forecast_phase3.py still runs on base model output.
      - name: Fetch intraday prices
        run: python src/data/fetch_intraday.py

      # Run the full inference pipeline in O(1) correction mode:
      #   base HGBR (frozen) → Kalman correction (sp_bias=false per corrector_config.json)
      #   → splice settled actuals → save next_day_forecast_phase3.csv + kalman_state.json
      #
      # Robustness handled inside the script:
      #   - Daily reset: fires automatically when settlement_date changes (first run of new day)
      #   - Idempotency: KalmanCorrector skips update if n_settled unchanged since last call
      #   - Guardrail: skips update if |z_t| > 500 £/MWh (data-quality anomaly)
      #   - Missing intraday file: runs base model + carries prior Kalman state unchanged
      - name: Run corrected forecast
        run: python src/models/forecast_phase3.py

      # Commit the Kalman filter state and corrected forecast back to the repo.
      # The no-diff guard prevents empty commits on idempotent reruns
      # (same actuals → state unchanged → CSV unchanged → nothing to stage).
      #
      # day2_forecast_phase3.csv: forecast_phase3.py writes this on every run
      # (intraday and daily); it is tracked in git, so it must be staged here
      # to avoid aborting the rebase with "unstaged changes" later.
      #
      # --autostash: stashes any residual working-tree changes before rebase
      # and restores them after — safety net for any untracked-but-tracked file.
      #
      # retry loop: handles transient concurrent-push races (exit 1 from push).
      - name: Commit state and forecast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== pre-commit git status ==="
          git status --porcelain
          git add model_assets/kalman_state.json \
                  model_assets/next_day_forecast_phase3.csv \
                  model_assets/day2_forecast_phase3.csv \
                  "model_assets/forecasts/"
          git diff --staged --quiet || {
            git commit -m "Intraday forecast update $(date -u +%Y-%m-%dT%H:%M)" &&
            for _i in 1 2 3; do
              git pull --rebase --autostash origin streamlit-data && git push && break
              echo "Push attempt $_i failed — retrying in ${_i}s"
              [ "$_i" -lt 3 ] && sleep "$_i"
            done
          }
